; ============================================================
; Morse Machine - PlatformIO configuratie
; Compatibel met ESP8266 en ESP32
; ============================================================

[platformio]
workspace_dir = .pio.nosync
default_envs = esp32dev-v1_1_1

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
upload_speed = 460800

lib_deps =
  bblanchon/ArduinoJson@^6.21.3

build_flags =
  -DWIFI_TIMEOUT=20      ; timeout in seconden

; ============================================================
; ESP32 target v1.1.1
; ============================================================
[env:esp32dev-v1_1_1]
platform = espressif32@6.8.1
board = esp32dev
extra_scripts = scripts/custom_build.py
;board_build.partitions = projects/morseMachine/esp32/v0.2.8/default.csv
upload_port = /dev/cu.usbserial-3224143
build_flags =
  ${env.build_flags}
  -DESP32
  -DVERSION=v1.1.1
  -DCORE_DEBUG_LEVEL=1
;  -DCORE_DEBUG_LEVEL=0      ; Geen logs
;  -DCORE_DEBUG_LEVEL=1      ; Alleen fouten
;  -DCORE_DEBUG_LEVEL=2      ; + waarschuwingen
;  -DCORE_DEBUG_LEVEL=3      ; + info
;  -DCORE_DEBUG_LEVEL=4      ; + debug
;  -DCORE_DEBUG_LEVEL=5      ; + verbose
lib_deps =
  ${env.lib_deps}
  tzapu/WiFiManager@^2.0.17

; ============================================================
; ESP32 target v2.2.2
; ============================================================
[env:esp32dev-v2_2_2]
platform = espressif32@6.8.1
board = esp32dev
extra_scripts = scripts/custom_build.py
board_build.partitions = partitions/bigProgPartitions.csv
upload_port = /dev/cu.usbserial-3224143
build_flags =
  ${env.build_flags}
  -DESP32
  -DVERSION=v2.2.2
  -DCORE_DEBUG_LEVEL=1
;  -DCORE_DEBUG_LEVEL=0      ; Geen logs
;  -DCORE_DEBUG_LEVEL=1      ; Alleen fouten
;  -DCORE_DEBUG_LEVEL=2      ; + waarschuwingen
;  -DCORE_DEBUG_LEVEL=3      ; + info
;  -DCORE_DEBUG_LEVEL=4      ; + debug
;  -DCORE_DEBUG_LEVEL=5      ; + verbose
lib_deps =
  ${env.lib_deps}
  tzapu/WiFiManager@^2.0.17

; ============================================================
; ESP32-S3 N8R8 v1.0.0 (8MB Flash, 8MB PSRAM)
; ============================================================
[env:esp32-s3-v1_0_0]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
extra_scripts = scripts/custom_build.py
board_build.partitions = partitions/default_8MB.csv
upload_port = /dev/cu.usbserial-*
build_flags =
  ${env.build_flags}
  -DESP32
  -DVERSION=v1.0.0
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
;  -DCORE_DEBUG_LEVEL=0      ; Geen logs
;  -DCORE_DEBUG_LEVEL=1      ; Alleen fouten
;  -DCORE_DEBUG_LEVEL=2      ; + waarschuwingen
;  -DCORE_DEBUG_LEVEL=3      ; + info
;  -DCORE_DEBUG_LEVEL=4      ; + debug
;  -DCORE_DEBUG_LEVEL=5      ; + verbose
lib_deps =
  ${env.lib_deps}
  tzapu/WiFiManager@^2.0.17
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.memory_type = opi_opi

; ============================================================
; ESP8266 v3.3.3
; ============================================================
[env:esp12e-v3_3_3]
platform = espressif8266@4.2.1
board = esp12e
extra_scripts = scripts/custom_build.py
upload_port = /dev/cu.wchusbserial32241430
build_flags =
  ${env.build_flags}
  -DESP8266
  -DVERSION=v3.3.3
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  ${env.lib_deps}
  tzapu/WiFiManager@^0.16.0
